[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "BETCGaming"
name = "ShockMine"
description = "A landmine that doesn't blow you up: it freezes everyone in the blast, zaps them with lightning, then knocks them flat."
websiteUrl = "https://github.com/BETCGaming/shockmine"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../../icon.png"
# The store page, written for players. README.md is the repository's (it carries build notes).
readme = "../../THUNDERSTORE.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/ShockMine/release/com.github.BETCGaming.ShockMine.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "super-battle-golf", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/super-battle-golf/category/
super-battle-golf = [ "mods", "allclients", "items", ]
